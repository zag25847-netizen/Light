<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Phishing Detector AI</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
<div class="header">
<div class="brand">
<div class="logo">🛡️</div>
<div>
<h1>Phishing Detector <span>AI</span></h1>
<p>ตรวจสอบเว็บไซต์ด้วย Machine Learning</p>
</div>
</div>
<div class="gear">⚙</div>
</div>
<div class="scan-box">
<div class="scan-icon">🌐</div>
<h2>ตรวจสอบเว็บไซต์</h2>
<p>ตรวจสอบเว็บไซต์ที่กำลังเปิด<br>ว่ามีความเสี่ยงหรือไม่</p>
<button id="scan">⌕ ตรวจสอบเว็บไซต์</button>
<div id="result">พร้อมตรวจสอบ</div>
</div>
<div class="status">
<span class="dot"></span>
พร้อมใช้งาน
</div>
<div class="menu">
<button id="analysisBtn">▦ ผลการวิเคราะห์</button>
<button id="historyBtn">◷ ประวัติการตรวจสอบ</button>
</div>
<div class="footer">
Powered by Random Forest
</div>
</div>
<script src="popup.js"></script>
</body>
</html>
